<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1e1e24;
      color: #f0f0f5;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      user-select: none;
      overflow: hidden;
      color-scheme: dark;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    .header {
      background: #25252d;
      padding: 16px 20px;
      border-bottom: 1px solid #2f2f38;
      font-size: 16px;
      font-weight: 600;
    }
    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .empty-state {
      text-align: center;
      color: #606070;
      padding: 40px 20px;
      font-size: 15px;
    }
    .empty-state .icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .layout-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .layout-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #25252d;
      border: 1px solid #2f2f38;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .layout-item:hover {
      background: #2a2a34;
      border-color: #007acc;
      box-shadow: 0 0 0 1px #007acc;
    }
    .layout-item.selected {
      background: #2a2a34;
      border-color: #007acc;
      box-shadow: 0 0 0 1px #007acc;
    }
    .layout-item:active {
      background: #007acc22;
    }
    .hint-bar {
      display: flex;
      gap: 16px;
      padding: 8px 20px;
      background: #1a1a20;
      border-top: 1px solid #2f2f38;
      font-size: 11px;
      color: #606070;
    }
    .hint-bar kbd {
      background: #32323d;
      color: #a0a0b0;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
      border: 1px solid #3e3e4a;
    }
    .layout-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .layout-icon {
      font-size: 20px;
      flex-shrink: 0;
    }
    .layout-details {
      flex: 1;
      min-width: 0;
    }
    .layout-name {
      font-weight: 600;
      font-size: 14px;
      color: #f0f0f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .layout-meta {
      font-size: 11px;
      color: #707080;
      margin-top: 3px;
    }
    .btn-delete {
      background: transparent;
      border: 1px solid transparent;
      color: #606070;
      font-size: 14px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-delete:hover {
      color: #ff5f56;
      background: #ff5f5612;
      border-color: #ff5f5640;
    }
    .footer {
      padding: 16px 20px;
      border-top: 1px solid #2f2f38;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: #1e1e24;
    }
    button.btn-cancel {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      background: #32323d;
      color: #fff;
    }
    button.btn-cancel:hover {
      background: #3e3e4a;
    }
    button:focus-visible {
      outline: 2px solid #007acc;
      outline-offset: 2px;
    }

    /* 確認刪除 overlay */
    .confirm-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .confirm-dialog {
      background: #25252d;
      border: 1px solid #3e3e4a;
      border-radius: 12px;
      padding: 24px;
      min-width: 300px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .confirm-dialog .title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .confirm-dialog .message {
      font-size: 13px;
      color: #a0a0b0;
      margin-bottom: 20px;
    }
    .confirm-dialog .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .confirm-dialog .actions button {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .confirm-dialog .btn-confirm-cancel {
      background: #32323d;
      color: #fff;
    }
    .confirm-dialog .btn-confirm-delete {
      background: #ff5f56;
      color: #fff;
    }
    .confirm-dialog .btn-confirm-delete:hover {
      background: #ff3b30;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">📐 載入視窗配置 (Load Layout)</div>
    <div class="content">
      <div id="layout-list" class="layout-list">
        <!-- 由 JS 動態生成 -->
      </div>
    </div>

    <div class="hint-bar">
      <span><kbd>↑</kbd><kbd>↓</kbd> 選擇</span>
      <span><kbd>Enter</kbd> 載入</span>
      <span><kbd>⌫</kbd> 刪除</span>
      <span><kbd>Esc</kbd> 取消</span>
    </div>
    <div class="footer">
      <button class="btn-cancel" onclick="onCancel()">取消</button>
    </div>
  </div>

  <script id="layouts-json" type="application/json">{{LAYOUTS_JSON}}</script>

  <script>
    const layouts = JSON.parse(document.getElementById('layouts-json').textContent);
    const listContainer = document.getElementById('layout-list');
    let selectedIndex = -1;
    let confirmOverlayEl = null;

    function render() {
      listContainer.innerHTML = '';

      if (layouts.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<div class="icon">📭</div><div>尚無已儲存的 Layout</div>';
        listContainer.appendChild(empty);
        return;
      }

      layouts.forEach((layout, index) => {
        const item = document.createElement('div');
        item.className = 'layout-item';
        item.dataset.index = index;

        const info = document.createElement('div');
        info.className = 'layout-info';

        const icon = document.createElement('span');
        icon.className = 'layout-icon';
        icon.textContent = '📄';

        const details = document.createElement('div');
        details.className = 'layout-details';

        const nameEl = document.createElement('div');
        nameEl.className = 'layout-name';
        nameEl.textContent = layout.name;

        const meta = document.createElement('div');
        meta.className = 'layout-meta';
        const parts = [];
        if (layout.windowCount !== undefined) {
          parts.push(layout.windowCount + ' 個視窗');
        }
        if (layout.createdAt) {
          const d = new Date(layout.createdAt * 1000);
          parts.push(d.toLocaleDateString('zh-TW') + ' ' + d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }));
        }
        meta.textContent = parts.join(' · ');

        details.appendChild(nameEl);
        details.appendChild(meta);
        info.appendChild(icon);
        info.appendChild(details);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.textContent = '🗑';
        deleteBtn.title = '刪除此 Layout';
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          showDeleteConfirm(layout.name);
        });

        item.appendChild(info);
        item.appendChild(deleteBtn);

        item.addEventListener('click', () => {
          onLoad(layout.name);
        });

        // 滑鼠懸停時也更新選取狀態
        item.addEventListener('mouseenter', () => {
          setSelected(index);
        });

        listContainer.appendChild(item);
      });

      // 預設選取第一項
      if (layouts.length > 0) {
        setSelected(0);
      }
    }

    function setSelected(index) {
      if (layouts.length === 0) return;
      selectedIndex = Math.max(0, Math.min(index, layouts.length - 1));
      const items = listContainer.querySelectorAll('.layout-item');
      items.forEach((el, i) => {
        el.classList.toggle('selected', i === selectedIndex);
      });
      // 確保選中項目可見
      if (items[selectedIndex]) {
        items[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function showDeleteConfirm(name) {
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      confirmOverlayEl = overlay;

      const dialog = document.createElement('div');
      dialog.className = 'confirm-dialog';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = '確認刪除';

      const message = document.createElement('div');
      message.className = 'message';
      message.textContent = '確定要刪除 "' + name + '" 嗎？此操作無法復原。';

      const actions = document.createElement('div');
      actions.className = 'actions';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn-confirm-cancel';
      cancelBtn.textContent = '取消';
      cancelBtn.addEventListener('click', () => dismissConfirm());

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn-confirm-delete';
      deleteBtn.textContent = '刪除';
      deleteBtn.addEventListener('click', () => {
        dismissConfirm();
        onDelete(name);
      });

      // 對話框鍵盤事件
      function onDialogKey(e) {
        if (e.key === 'Escape') {
          e.stopPropagation();
          dismissConfirm();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          dismissConfirm();
          onDelete(name);
        }
      }

      function dismissConfirm() {
        overlay.removeEventListener('keydown', onDialogKey);
        overlay.remove();
        confirmOverlayEl = null;
      }

      overlay.addEventListener('keydown', onDialogKey);
      overlay.setAttribute('tabindex', '-1');

      actions.appendChild(cancelBtn);
      actions.appendChild(deleteBtn);
      dialog.appendChild(title);
      dialog.appendChild(message);
      dialog.appendChild(actions);
      overlay.appendChild(dialog);
      document.body.appendChild(overlay);
      overlay.focus();
    }

    function onLoad(name) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hammerspoon) {
        window.webkit.messageHandlers.hammerspoon.postMessage({ action: "load", name: name });
      }
    }

    function onDelete(name) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hammerspoon) {
        window.webkit.messageHandlers.hammerspoon.postMessage({ action: "delete", name: name });
      }
      // 從列表中移除並重新渲染
      const idx = layouts.findIndex(l => l.name === name);
      if (idx !== -1) {
        layouts.splice(idx, 1);
        // 調整選取索引，避免超出範圍
        if (selectedIndex >= layouts.length) {
          selectedIndex = layouts.length - 1;
        }
        render();
      }
    }

    function onCancel() {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hammerspoon) {
        window.webkit.messageHandlers.hammerspoon.postMessage({ action: "cancel" });
      }
    }

    // 鍵盤導覽
    window.addEventListener('keydown', (e) => {
      // 如果刪除確認對話框開啟，由對話框自己處理
      if (confirmOverlayEl) return;

      switch (e.key) {
        case 'Escape':
          onCancel();
          break;
        case 'ArrowUp':
        case 'k':
          e.preventDefault();
          if (layouts.length > 0) {
            setSelected(selectedIndex <= 0 ? layouts.length - 1 : selectedIndex - 1);
          }
          break;
        case 'ArrowDown':
        case 'j':
          e.preventDefault();
          if (layouts.length > 0) {
            setSelected(selectedIndex >= layouts.length - 1 ? 0 : selectedIndex + 1);
          }
          break;
        case 'Enter':
          e.preventDefault();
          if (selectedIndex >= 0 && selectedIndex < layouts.length) {
            onLoad(layouts[selectedIndex].name);
          }
          break;
        case 'Backspace':
        case 'Delete':
          e.preventDefault();
          if (selectedIndex >= 0 && selectedIndex < layouts.length) {
            showDeleteConfirm(layouts[selectedIndex].name);
          }
          break;
      }
    });

    render();
  </script>
</body>
</html>
